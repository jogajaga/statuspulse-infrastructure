[gitlab]
#Replace with the target server's IP address or DNS name
gitlab01 ansible_host=SERVER_ADDRESS

[gitlab:vars]
#SSH user on the target server
ansible_user=USER_NAME

#SSH port on the target server
ansible_port=PORT

#Private SSH key on the Ansible control node
ansible_ssh_private_key_file=~/.ssh/gitlab_ansible

# Python interpreter on the target server
ansible_python_interpreter=/usr/bin/python3
